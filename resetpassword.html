<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saman Healthcare | New Password</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="forgotpass.css">
    <link rel="stylesheet" href="site-motion.css?v=20261005">
    <script src="api.js"></script>
</head>

<body>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
        <span class="theme-toggle-label">Dark mode</span>
    </button>
    <!-- The same recovery shell keeps this page visually consistent with Forgot Password. -->
    <main class="reset-shell">
        <section class="reset-welcome" aria-label="Saman Healthcare">
            <div class="brand"><span class="brand-mark" aria-hidden="true">+</span> <span class="brand-text">Saman
                    Healthcare</span></div>
            <div class="welcome-copy">
                <p class="eyebrow">PHONE VERIFIED</p>
                <h1>Create a new password securely.</h1>
                <p>Set a strong password and a new 4-digit login PIN for your Saman Healthcare account.</p>
            </div>
        </section>

        <section class="reset-panel">
            <div class="reset-card">
                <h2>Set new credentials</h2>
                <p class="intro-text">Create a secure new password and login PIN below.</p>
                <form id="passwordForm">
                    <div class="field">
                        <label for="newPassword">New password</label>
                        <input id="newPassword" type="password" minlength="8" placeholder="At least 8 characters" required>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Confirm new password</label>
                        <input id="confirmPassword" type="password" minlength="8" placeholder="Repeat your password" required>
                    </div>
                    <div class="field">
                        <label for="newPin">New login PIN</label>
                        <input id="newPin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="4-digit PIN" required>
                    </div>
                    <div class="field">
                        <label for="confirmPin">Confirm login PIN</label>
                        <input id="confirmPin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="Repeat PIN" required>
                    </div>
                    <button class="primary-button" type="submit">Change credentials</button>
                </form>
                <p class="status" id="status" role="status"></p>
                <p class="back-link"><a href="loginround2.html">Back to login</a></p>
            </div>
        </section>
    </main>

    <script>
        const resetToken = new URLSearchParams(window.location.search).get('token');
        const passwordForm = document.getElementById('passwordForm');
        const status = document.getElementById('status');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const newPin = document.getElementById('newPin');
        const confirmPin = document.getElementById('confirmPin');
        const backendBase = API.backendBaseUrl;

        if (!resetToken) {
            passwordForm.hidden = true;
            status.textContent = 'This reset link is invalid. Please verify your account again.';
        }

        passwordForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (newPassword.value !== confirmPassword.value) {
                status.textContent = 'The passwords do not match.';
                return;
            }
            if (newPin.value !== confirmPin.value) {
                status.textContent = 'The PIN values do not match.';
                return;
            }
            if (!/^\d{4}$/.test(newPin.value)) {
                status.textContent = 'The login PIN must be exactly 4 digits.';
                return;
            }

            status.textContent = 'Updating your password and PIN...';
            try {
                const response = await fetch(`${backendBase}/api/forgot-password/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reset_token: resetToken,
                        new_password: newPassword.value,
                        new_pin: newPin.value
                    })
                });
                const result = await response.json();
                status.textContent = result.message;
                if (response.ok) {
                    setTimeout(() => { window.location.href = 'loginround2.html'; }, 900);
                }
            } catch (error) {
                status.textContent = 'Cannot connect to the Python backend.';
            }
        });
    </script>
</body>

</html>
